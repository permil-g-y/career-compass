<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <title>Career Compass Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #f5f7fb;
        -webkit-font-smoothing: antialiased;
      }
      body {
        font-family: 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #16233a;
      }
      * {
        box-sizing: border-box;
      }
      button {
        font-family: inherit;
      }
      input,
      select,
      textarea {
        font-family: inherit;
      }
      .cc-admin-control:focus {
        border-color: #1b66f5;
        box-shadow: 0 0 0 3px rgba(27, 102, 245, 0.14);
      }
      .cc-admin-row:hover > td {
        background: #f7faff;
      }
      table {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div id="admin-root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
