<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Career Compass｜就活現在地診断</title>
    <meta name="description" content="質問に答えるだけで、志望先への現在地と、内定に近づくために次にやるべきことが分かります。" />
    <link rel="icon" href="./assets/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #edf4ff;
        -webkit-font-smoothing: antialiased;
      }
      body {
        font-family: 'Noto Sans JP', system-ui, sans-serif;
        color: #16233a;
      }
      * {
        box-sizing: border-box;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: default;
      }
      input {
        font-family: inherit;
      }
      a {
        color: #1b66f5;
      }
      a:hover {
        color: #0b3c91;
      }
      @keyframes ccFadeUp {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes ccPop {
        0% {
          opacity: 0;
          transform: scale(0.7);
        }
        60% {
          transform: scale(1.08);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes ccSpin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes ccGrow {
        from {
          width: 0;
        }
      }
      .cc-press {
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .cc-press:active:not(:disabled) {
        transform: scale(0.985);
      }
      .cc-cta:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #eea900, 0 7px 14px rgba(120, 80, 0, 0.16);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
